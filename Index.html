<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Minha Aula</title><meta name="theme-color" content="#174092"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&family=Kanit:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF4FB;--cd:#fff;--tx:#0D2148;--mu:#5A6E8F;--pr:#174092;--pr2:#3F7BD9;--gr:#02B01B;--bd:#D9E5F2;--sh:0 10px 30px rgba(23,64,146,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1226;--cd:#111D38;--tx:#EAF1FF;--mu:#8EA3C9;--pr:#3D7FE6;--pr2:#5C97F0;--gr:#12C42D;--bd:#1F2F53;--sh:0 10px 30px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#0A1226;--cd:#111D38;--tx:#EAF1FF;--mu:#8EA3C9;--pr:#3D7FE6;--pr2:#5C97F0;--gr:#12C42D;--bd:#1F2F53;--sh:0 10px 30px rgba(0,0,0,.45)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.45 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0;letter-spacing:-.02em}
main{max-width:480px;margin:0 auto;padding:18px 18px 110px}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--bd);background:var(--cd);outline:0;margin-top:6px}
input:focus,select:focus{border-color:var(--pr)}
label{display:block;margin-top:12px;font-weight:700;font-size:13px;color:var(--mu)}
.btn{width:100%;padding:14px;border:0;border-radius:16px;background:var(--pr);color:#fff;font-weight:700;font-size:16px;margin-top:16px;cursor:pointer;box-shadow:0 8px 20px rgba(23,64,146,.35)}
.btn.g{background:transparent;color:var(--pr);box-shadow:none;border:1.5px dashed var(--pr2)}
.btn.r{background:transparent;color:#E5484D;box-shadow:none}
.login{position:relative;min-height:88vh;display:flex;flex-direction:column;justify-content:center}
.lg{display:inline-flex;flex-direction:column;font-family:'Kanit','Arial Black',system-ui,sans-serif;font-style:italic;line-height:.95}
.lg i{font-weight:700;letter-spacing:.46em;color:var(--gr);font-size:14px;padding-left:4px}.lg b{font-weight:800;font-size:76px;letter-spacing:-.02em;color:var(--pr);text-shadow:0 6px 22px rgba(23,64,146,.25)}
.login .lg{margin-bottom:10px}.hero .lg{position:absolute;right:20px;top:18px;z-index:1;align-items:flex-end}.hero .lg i{color:#B9F7C3;font-size:9px}.hero .lg b{color:#fff;font-size:34px;text-shadow:none}
.tg{border:0;background:rgba(255,255,255,.22);color:#fff;height:34px;padding:0 13px;border-radius:99px;font-size:13px;font-weight:700;cursor:pointer;margin-left:auto}.login .tg{position:absolute;top:0;right:0;height:40px;background:var(--cd);color:var(--tx);box-shadow:var(--sh);border:1px solid var(--bd)}
.login h1{font-size:28px;font-weight:800}.login p{color:var(--mu);margin:6px 0 14px}
.hero{background:linear-gradient(135deg,#174092,#1D63C9 58%,#0BB552);color:#fff;border-radius:28px;padding:22px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero h1{font-size:28px;font-weight:800;padding-right:90px}.hero p{margin:4px 0 0;opacity:.85}
.pills{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.pill{background:rgba(255,255,255,.2);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:700}
h2{font-size:20px;margin:26px 0 10px;font-weight:800}
.it{display:flex;gap:12px;align-items:center;background:var(--cd);border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:var(--sh);border:1px solid var(--bd)}
.bar{width:6px;align-self:stretch;border-radius:9px;flex:none}
.it .b{flex:1;min-width:0}.it b{display:block;font-size:16px}.it small{color:var(--mu)}
.now{background:var(--gr);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;margin-left:6px}
.tm{font-family:'Bricolage Grotesque';font-weight:800;text-align:right;font-size:15px;line-height:1.2}.tm small{display:block;font-family:'DM Sans';font-weight:500}
.ck{width:26px;height:26px;border-radius:9px;border:2px solid var(--pr2);background:none;flex:none;cursor:pointer;color:#fff;font-weight:800}
.ck.on{background:var(--gr);border-color:var(--gr)}.done b{text-decoration:line-through;opacity:.5}
.x{border:0;background:none;color:var(--mu);font-size:18px;cursor:pointer;padding:6px}
.empty{text-align:center;color:var(--mu);padding:26px 10px;border:1.5px dashed var(--bd);border-radius:20px}
.days,.sw{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.dc{flex:none;min-width:52px;padding:10px 0;text-align:center;border-radius:16px;background:var(--cd);border:1.5px solid var(--bd);font-weight:700;cursor:pointer}
.dc.on{background:var(--pr);color:#fff;border-color:var(--pr)}.dc.hj{box-shadow:0 0 0 2px var(--gr)}
.sw span{width:34px;height:34px;border-radius:12px;flex:none;cursor:pointer;border:3px solid transparent}.sw span.on{border-color:var(--tx)}
.tab{position:fixed;left:0;right:0;bottom:0;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));background:var(--cd);border-top:1px solid var(--bd);display:flex;justify-content:center;gap:4px}
.tab button{flex:1;max-width:110px;border:0;background:none;color:var(--mu);font-size:11px;font-weight:700;display:grid;justify-items:center;gap:3px;padding:6px;border-radius:14px;cursor:pointer}
.tab button.on{color:var(--pr);background:var(--bg)}.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sheet{position:fixed;inset:0;background:rgba(5,12,32,.62);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.o{display:flex}.sheet>div{background:var(--bg);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.seg{display:flex;background:var(--cd);border-radius:14px;padding:4px;margin-top:6px;border:1.5px solid var(--bd)}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:700;color:var(--mu);cursor:pointer}.seg button.on{background:var(--pr);color:#fff}
textarea{width:100%;height:74px;border-radius:14px;border:1.5px solid var(--bd);background:var(--cd);color:var(--mu);padding:10px;font-size:12px;margin-top:6px;resize:none}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:20}#toast.o{opacity:1}
#off{display:none;position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:30;background:var(--tx);color:var(--bg);text-align:center;font-size:12px;font-weight:700;padding:5px}#off.o{display:block}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<main id="app"></main><div class="sheet" id="sh" onclick="if(event.target==this)cl()"><div id="shb"></div></div><div id="off">Sem internet · tudo continua funcionando</div><div id="toast"></div>
<script>
const SRC='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
const $=s=>document.querySelector(s),DN=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'],ORD=[1,2,3,4,5,6,0],COL=['#174092','#02B01B','#1D8FE1','#00A88F','#5B7CFA','#7BC043','#0B6E99','#F5A623'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE'),mins=t=>{const[a,b]=t.split(':');return+a*60+ +b},uid=()=>Math.random().toString(36).slice(2,9);
let S=null;try{S=JSON.parse(localStorage.getItem('aula'))}catch(e){}
const save=()=>{try{localStorage.setItem('aula',JSON.stringify(S))}catch(e){toast('Não consegui salvar neste navegador. Copie um backup!')}};
let tab='hoje',sel=new Date().getDay(),fc=COL[0],ftype='dia',fdays=[];
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('o');setTimeout(()=>t.classList.remove('o'),2200)};
const cl=()=>$('#sh').classList.remove('o');
const op=h=>{$('#shb').innerHTML=h;$('#sh').classList.add('o')};
const IC={hoje:'<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/>',hor:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/>',lem:'<path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 004 0"/>',quiz:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 115 0c0 1.7-2.5 2-2.5 3.7M12 17h.01"/>',pan:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',eu:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'};
function activeRem(){const t=today(),n=Date.now();return S.rem.filter(r=>r.fixed?(!r.exp||r.exp>=n):true).filter(r=>r.fixed||r.d>=t)}
function render(){
 if(!S){$('#app').innerHTML=`<div class="login"><button class="tg" onclick="tog()" aria-label="Alternar tema">${ico()}</button><div class="lg" aria-label="Escola SESI"><i>ESCOLA</i><b>SESI</b></div><h1>Minha Aula</h1><p>Seu horário e seus lembretes, sempre à mão.</p>
 <label>Seu nome</label><input id="nm" placeholder="Ex: Ana"><label>Sua sala</label><select id="tm"><option value="">Escolha sua sala</option>${ROOMS.map(r=>`<option>${r}</option>`).join('')}</select>
 <label>Código de um colega (opcional)</label><input id="cd" placeholder="Cole aqui para copiar o horário dele"><button class="btn" onclick="enter()">Entrar</button></div>`;return}
 const T={hoje:hoje,hor:horario,lem:lembretes,eu:perfil,pan:painel,quiz:quiz};
 $('#app').innerHTML=T[tab]()+`<nav class="tab">${[['hoje','Hoje'],['hor','Horário'],['lem','Lembretes'],['eu','Perfil'],...(OWN?[['pan','Painel']]:[]),...(QCAP?[['quiz','Quiz']]:[])].map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render();scrollTo(0,0)"><svg viewBox="0 0 24 24">${IC[k]}</svg>${l}</button>`).join('')}</nav>`}
function enter(){const n=$('#nm').value.trim();if(!n)return toast('Digite seu nome');if(!$('#tm').value)return toast('Escolha sua sala');S={name:n,turma:$('#tm').value,sched:{},rem:[],notif:false};const c=$('#cd').value.trim();if(c){const d=dec(c);if(d)S.sched=d.s;else toast('Código inválido — entrei sem ele')}save();sub();reg();render()}
function aulas(d){return(S.sched[d]||[]).slice().sort((a,b)=>mins(a.s)-mins(b.s))}
function rowAula(a,now){const nw=now!=null&&now>=mins(a.s)&&now<mins(a.e);return`<div class="it"><i class="bar" style="background:${a.c}"></i><div class="b"><b>${esc(a.m)}${nw?'<span class="now">AGORA</span>':''}</b><small>${a.r?esc(a.r):'Sem sala'}</small></div><div class="tm">${a.s}<small>até ${a.e}</small></div>${now==null?`<button class="x" onclick="fAula('${a.id}')">✎</button>`:''}</div>`}
function rowRem(r,ed){const dn=r.done;return`<div class="it ${dn?'done':''}"><button class="ck ${dn?'on':''}" onclick="tg('${r.id}')">${dn?'✓':''}</button><div class="b" onclick="${ed?`fRem('${r.id}')`:''}"><b>${esc(r.t)}</b><small>${r.fixed?'Fixo · '+(r.exp?'até '+new Date(r.exp).toLocaleDateString('pt-BR'):'para sempre'):new Date(r.d+'T12:00').toLocaleDateString('pt-BR',{day:'numeric',month:'short'})}${r.time?' · '+r.time:''}</small></div>${ed?`<button class="x" onclick="rm('${r.id}')">✕</button>`:''}</div>`}
function hoje(){const d=new Date(),a=aulas(d.getDay()),now=d.getHours()*60+d.getMinutes(),t=today(),rs=activeRem().filter(r=>r.fixed||r.d==t),av=avHoje(),h=d.getHours();
 return`<div class="hero"><div class="lg" aria-label="Escola SESI"><i>ESCOLA</i><b>SESI</b></div><h1>${h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}, ${esc(S.name)}!</h1><p>${DN[d.getDay()]}, ${d.toLocaleDateString('pt-BR',{day:'numeric',month:'long'})}</p><div class="pills"><span class="pill">${a.length} aula${a.length==1?'':'s'}</span><span class="pill">${rs.filter(r=>!r.done).length+av.length} lembrete(s)</span>${S.turma?`<span class="pill">Turma ${esc(S.turma)}</span>`:''}<button class="tg" onclick="tog()" aria-label="Alternar tema">${ico()}</button></div></div>
 <h2>Aulas de hoje</h2>${a.length?a.map(x=>rowAula(x,now)).join(''):'<div class="empty">Nenhuma aula hoje 🎉<br>Cadastre suas matérias na aba Horário.</div>'}
 <h2>Lembretes de hoje</h2>${rs.length+av.length?av.map(rowAv).join('')+rs.map(r=>rowRem(r,false)).join(''):'<div class="empty">Nada para lembrar hoje.</div>'}`}
function horario(){const a=aulas(sel);return`<h2 style="margin-top:8px">Meu horário</h2><div class="days">${ORD.map(d=>`<div class="dc ${d==sel?'on':''} ${d==new Date().getDay()?'hj':''}" onclick="sel=${d};render()">${DN[d].slice(0,3)}</div>`).join('')}</div>
 <h2 style="font-size:17px">${DN[sel]}</h2>${a.length?a.map(x=>rowAula(x)).join(''):'<div class="empty">Sem matérias neste dia.</div>'}<button class="btn g" onclick="fAula()">+ Adicionar matéria</button>`}
function lembretes(){const f=S.rem.filter(r=>r.fixed&&(!r.exp||r.exp>=Date.now())),d=S.rem.filter(r=>!r.fixed&&r.d>=today()).sort((a,b)=>a.d.localeCompare(b.d));
 return`<h2 style="margin-top:8px">Lembretes</h2>${DBO?`<h3 style="margin:14px 0 8px;color:var(--mu)">📣 Da sala ${esc(S.turma)}</h3>${myAv().filter(a=>a.fixed?avAct(a):a.d>=today()).map(rowAv).join('')||'<div class="empty">Nenhum aviso da sala.</div>'}`:''}<h3 style="margin:14px 0 8px;color:var(--mu)">Fixos</h3>${f.length?f.map(r=>rowRem(r,true)).join(''):'<div class="empty">Nenhum lembrete fixo.</div>'}<h3 style="margin:18px 0 8px;color:var(--mu)">Com data</h3>${d.length?d.map(r=>rowRem(r,true)).join(''):'<div class="empty">Nenhum lembrete com data.</div>'}<button class="btn g" onclick="fRem()">+ Novo lembrete</button>`}
function perfil(){return`<h2 style="margin-top:8px">Perfil</h2><div class="it"><div class="b"><b>${OWN?'Dono':isMod()?'Moderador':'Aluno'}</b><small>${DBO?'Avisos da sala ativos':'Avisos da sala indisponíveis neste modo'}</small></div></div><label>Nome</label><input value="${esc(S.name)}" onchange="S.name=this.value;save();reg();toast('Salvo')"><label>Sala</label><select onchange="S.turma=this.value;save();sub();reg();render();toast('Salvo')">${ROOMS.map(r=>`<option ${r==S.turma?'selected':''}>${r}</option>`).join('')}</select>
 <h2>Aparência</h2><div class="seg">${[['auto','Automático'],['light','Claro'],['dark','Escuro']].map(([k,l])=>`<button class="${TM()==k?'on':''}" onclick="setTheme('${k}');render()">${l}</button>`).join('')}</div>
 <h2>Notificações</h2><div class="it"><div class="b"><b>Avisos no celular</b><small>${S.notif?'Ativadas: aula em 10 min e lembretes com hora':'Receba aviso das aulas e lembretes'}</small></div></div>${S.notif?'':'<button class="btn" style="margin-top:0" onclick="askN()">Ativar notificações</button>'}
 <h2>Uso offline</h2><div class="it"><div class="b"><b>${navigator.onLine?'Você está online':'Você está offline'}</b><small>Tudo fica salvo neste aparelho e funciona sem internet.</small></div></div>${DL?'<button class="btn g" style="margin-top:0" onclick="saveApp()">Baixar o app para usar offline</button>':''}<button class="btn g" style="margin-top:8px" onclick="bk()">Copiar backup completo</button>
 <h2>Compartilhar horário</h2><label>Seu código</label><textarea readonly onclick="this.select()">${enc()}</textarea><button class="btn g" style="margin-top:8px" onclick="navigator.clipboard.writeText(enc()).then(()=>toast('Código copiado!'),()=>toast('Selecione e copie o código'))">Copiar meu código</button>
 <label>Importar código de colega ou backup</label><input id="imp" placeholder="Cole o código aqui"><button class="btn" onclick="imp()">Importar horário</button><button class="btn r" onclick="if(confirm('Sair e apagar tudo deste aparelho?')){S=null;localStorage.removeItem('aula');render()}">Sair</button>`}
function enc(){try{return'AULA-'+btoa(unescape(encodeURIComponent(JSON.stringify({n:S.name,t:S.turma,s:S.sched}))))}catch(e){return''}}
function dec(c){try{return JSON.parse(decodeURIComponent(escape(atob(c.trim().replace(/^(AULA|BKP)-/,'')))))}catch(e){return null}}
function bk(){try{const c='BKP-'+btoa(unescape(encodeURIComponent(JSON.stringify({n:S.name,t:S.turma,s:S.sched,r:S.rem}))));navigator.clipboard.writeText(c).then(()=>toast('Backup copiado! Guarde em lugar seguro'),()=>prompt('Copie seu backup:',c))}catch(e){}}
let DL=null;try{window.claude&&claude.use('downloads').then(d=>{DL=d;if(S&&tab=='eu')render()},()=>{})}catch(e){}
function saveApp(){DL.save({filename:'minha-aula.html',data:SRC}).then(()=>toast('Arquivo salvo! Abra no navegador, mesmo offline'),e=>{if(!e||e.code!='declined')toast('Não foi possível baixar')})}
function imp(){const v=$('#imp').value.trim(),d=dec(v);if(!d||!d.s)return toast('Código inválido');if(/^BKP-/.test(v)){if(!confirm('Restaurar backup? Isso substitui seus dados atuais.'))return;S.name=d.n||S.name;S.turma=d.t||'';S.sched=d.s;S.rem=d.r||[];save();tab='hoje';render();return toast('Backup restaurado!')}if(!confirm(`Trocar seu horário pelo de ${d.n||'colega'}?`))return;S.sched=d.s;if(d.t&&!S.turma)S.turma=d.t;save();tab='hor';render();toast('Horário importado!')}
function tg(id){const r=S.rem.find(x=>x.id==id);r.done=!r.done;save();render()}
function rm(id){if(!confirm('Apagar este lembrete?'))return;S.rem=S.rem.filter(x=>x.id!=id);save();render()}
function sw(){return COL.map(c=>`<span class="${c==fc?'on':''}" style="background:${c}" onclick="fc='${c}';document.querySelectorAll('.sw span').forEach(e=>e.classList.toggle('on',e.style.background&&e.getAttribute('style').includes('${c}')))"></span>`).join('')}
function fAula(id){const a=id?Object.values(S.sched).flat().find(x=>x.id==id):{m:'',s:'08:00',e:'08:50',r:'',c:COL[0]};fc=a.c;fdays=[sel];
 op(`<h2 style="margin-top:0">${id?'Editar':'Nova'} matéria</h2><label>Matéria</label><input id="fm" value="${esc(a.m)}" placeholder="Ex: Matemática"><div style="display:flex;gap:10px"><div style="flex:1"><label>Início</label><input id="fs" type="time" value="${a.s}"></div><div style="flex:1"><label>Fim</label><input id="fe" type="time" value="${a.e}"></div></div><label>Sala (opcional)</label><input id="fr" value="${esc(a.r)}" placeholder="Ex: Sala 12">
 <label>Cor</label><div class="sw">${sw()}</div>${id?'':`<label>Repetir nos dias</label><div class="days">${ORD.map(d=>`<div class="dc ${d==sel?'on':''}" onclick="this.classList.toggle('on');fdays=[...document.querySelectorAll('#shb .dc.on')].map(e=>ORD[[...e.parentNode.children].indexOf(e)])">${DN[d].slice(0,3)}</div>`).join('')}</div>`}
 <button class="btn" onclick="sAula('${id||''}')">Salvar</button>${id?`<button class="btn r" onclick="dAula('${id}')">Apagar matéria</button>`:''}`)}
function sAula(id){const m=$('#fm').value.trim(),s=$('#fs').value,e=$('#fe').value;if(!m||!s||!e)return toast('Preencha matéria e horários');if(mins(e)<=mins(s))return toast('O fim precisa ser depois do início');
 const o={id:id||uid(),m,s,e,r:$('#fr').value.trim(),c:fc};if(id){for(const d in S.sched)S.sched[d]=S.sched[d].map(x=>x.id==id?o:x)}else{if(!fdays.length)return toast('Escolha ao menos um dia');fdays.forEach(d=>{(S.sched[d]=S.sched[d]||[]).push({...o,id:uid()})})}save();cl();render()}
function dAula(id){for(const d in S.sched)S.sched[d]=S.sched[d].filter(x=>x.id!=id);save();cl();render()}
function fRem(id){const r=id?S.rem.find(x=>x.id==id):{t:'',d:today(),fixed:false,time:''};ftype=r.fixed?'fixo':'dia';

 ${isMod()&&!id?`<label>Para quem?</label><select id="lr"><option value="">Só para mim</option>${(OWN?ROOMS:[S.turma]).map(r=>`<option value="${r}">Toda a sala ${r}</option>`).join('')}</select>`:''}<label>Hora do aviso (opcional)</label><input id="lh" type="time" value="${r.time||''}"><button class="btn" onclick="sRem('${id||''}')">Salvar</button>`);ty(ftype)}
function ty(t,b){ftype=t;if(b){b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}$('#fd').style.display=t=='dia'?'block':'none';$('#ff').style.display=t=='fixo'?'block':'none'}
function sRem(id){const t=$('#lt').value.trim();if(!t)return toast('Escreva o lembrete');const fx=ftype=='fixo',n=+$('#lx').value,e=new Date();e.setHours(23,59,59,0);e.setDate(e.getDate()+n);

async function askN(){if(!('Notification' in window))return toast('Este navegador não suporta notificações');const p=await Notification.requestPermission();S.notif=p=='granted';save();render();if(S.notif)ntf('Notificações ativadas ✅','Você será avisado das aulas e lembretes.');else toast('Permissão negada no navegador')}

const dk=()=>{const t=document.documentElement.dataset.theme;return t=='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches)},ico=()=>dk()?'☀️ Claro':'🌙 Escuro';

const ROOMS=['2º A','2º B','2º C','2º D'];let DBO=null,ME=null,OWN=false,MODS=new Set(),AV=[],MEM=[],uns=[];
const isMod=()=>OWN||!!(ME&&MODS.has(ME.id)),myAv=()=>AV.filter(a=>S&&a.room==S.turma),avAct=a=>a.fixed?(!a.exp||a.exp>=Date.now()):a.d>=today(),avHoje=()=>myAv().filter(a=>a.fixed?avAct(a):a.d==today()),rr=()=>{if(S&&!$('#sh').classList.contains('o'))render()};
async function initDb(){try{const[d,u]=await Promise.all([claude.use('db'),claude.use('user')]);if(!d||!u)return;DBO=d;ME=await u.me();OWN=await u.isOwner();

function sub(){if(!DBO||!S)return;uns.forEach(f=>f());uns=[];AV=[];const c=DBO.collection('avisos'),q=OWN?c:c.where('room','==',S.turma||'-');uns=[q.onSnapshot(x=>{AV=x.docs.map(y=>({id:y.id,...y.data()}));rr()},()=>{})]}

function painel(){const by=r=>MEM.filter(m=>m.room==r),na=r=>AV.filter(a=>a.room==r&&avAct(a)).length;

let QCAP=null,QS={code:'',net:null,rd:null,i:0,sc:0,done:false,sel:-1,tot:0,w:0,subj:'',n:10,busy:false,aw:0,un:[],buf:{}};
async function initQ(){try{const[r,sm]=await Promise.all([claude.use('room'),claude.use('sample')]);if(r&&sm){QCAP={r,sm};render()}}catch(e){}}
const rq=()=>{if(tab=='quiz'&&S)render()},okQs=q=>Array.isArray(q)&&q.length>0&&q.length<=20&&q.every(x=>x&&typeof x.q=='string'&&Array.isArray(x.o)&&x.o.length==4&&x.o.every(o=>typeof o=='string')&&[0,1,2,3].includes(x.a));
const pres=()=>QS.net&&QS.net.presence({n:clean(S.name),s:QS.sc,d:QS.done,r:QS.rd?QS.rd.id:0,tot:QS.tot,w:QS.w}).catch(()=>{});
const clean=t=>String(t).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u00AD\u200B-\u200F\u202A-\u202E\u2060-\u206F\uFEFF]/g,''),te=new TextEncoder(),by=x=>te.encode(JSON.stringify(x)).length;
async function send(id,subj,qs){const ps=[];let c=[];for(const q of qs){if(c.length&&by({t:'p',id,k:0,qs:[...c,q]})>3000){ps.push(c);c=[]}c.push(q)}if(c.length)ps.push(c);
 try{await QS.net.emit('q',{t:'r',id,subj,np:ps.length});for(let k=0;k<ps.length;k++)await QS.net.emit('q',{t:'p',id,k,qs:ps[k]})}catch(e){toast('Não consegui enviar aos amigos ('+((e&&e.code)||'erro')+')')}}
function qrecv(d){if(!d||!(+d.id>0))return;const b=QS.buf[d.id]=QS.buf[d.id]||{ps:{}};if(d.t=='r'){b.subj=String(d.subj||'').slice(0,300);b.np=+d.np}else if(d.t=='p'&&Array.isArray(d.qs)&&+d.k>=0&&+d.k<10)b.ps[+d.k]=d.qs;
 if(b.np>0&&Object.keys(b.ps).length==b.np){const qs=[].concat(...Array.from({length:b.np},(_,k)=>b.ps[k]||[]));delete QS.buf[d.id];if(okQs(qs))startRound({id:+d.id,subj:b.subj,qs})}}
function qleave(){QS.un.forEach(f=>f());QS.un=[];try{QS.net&&QS.net.leave()}catch(e){}}
async function qjoin(c){c=String(c).trim().toUpperCase();if(!/^[A-Z0-9]{4,6}$/.test(c))return toast('Código inválido');try{const n=await QCAP.r.join('quiz-'+c.toLowerCase());qleave();Object.assign(QS,{code:c,net:n,rd:null,i:0,sc:0,done:false,sel:-1,tot:0,w:0,aw:0,busy:false,un:[],buf:{}});

 QS.un.push(n.onPeers(()=>{qchk();upd()}));pres();rq()}catch(e){toast(e&&e.code=='not_permitted'?'Seu acesso não permite salas. Peça permissão ao dono.':'Não consegui entrar na sala ('+((e&&e.code)||'erro')+')')}}
function startRound(d){if(QS.rd&&d.id<=QS.rd.id)return;QS.rd=d;QS.i=0;QS.sc=0;QS.done=false;QS.sel=-1;QS.busy=false;pres();rq()}
async function qgen(){const sj=QS.subj.trim();if(!sj)return toast('Escreva a matéria');QS.busy=true;rq();
 try{const qs=await QCAP.sm.json(`Crie ${QS.n} perguntas de múltipla escolha em português do Brasil sobre o assunto: "${sj.slice(0,300)}", nível ensino médio. Responda SOMENTE com JSON no formato [{"q":"pergunta","o":["A","B","C","D"],"a":0}], onde "a" é o índice (0 a 3) da alternativa correta e as 4 opções são diferentes.`,{cache:false});
 if(!okQs(qs))throw 0;const id=Date.now(),sub=clean(sj),ql=qs.slice(0,QS.n).map(x=>({q:clean(x.q),o:x.o.map(clean),a:x.a}));startRound({id,subj:sub,qs:ql});send(id,sub,ql)}catch(e){QS.busy=false;toast('Não consegui criar as perguntas. Tente de novo');rq()}}
function qans(k){if(QS.sel>=0||QS.done||!QS.rd)return;const q=QS.rd.qs[QS.i];QS.sel=k;if(k==q.a)QS.sc++;rq();
 setTimeout(()=>{QS.i++;QS.sel=-1;if(QS.i>=QS.rd.qs.length)QS.done=true;pres();rq();qchk()},900)}
const plist=()=>{const rd=QS.rd,me={n:S.name,s:QS.sc,d:QS.done,r:rd?rd.id:0,tot:QS.tot,w:QS.w,me:true},a=QS.net?QS.net.peers().filter(p=>!p.isMe).map(p=>({...p.presence})):[];return[me,...a]};
function qchk(){const rd=QS.rd;if(!rd||!QS.done||QS.aw==rd.id)return;const ps=plist().filter(p=>p.r==rd.id);if(ps.length<2||!ps.every(p=>p.d))return;

const upd=()=>{const e=$('#rk');if(e)e.innerHTML=rkHtml()};
function rkHtml(){const rid=QS.rd?QS.rd.id:0,n=QS.rd?QS.rd.qs.length:0,L=plist().sort((a,b)=>(a.r==rid&&b.r==rid&&rid?(+b.s||0)-(+a.s||0):0)||(+b.w||0)-(+a.w||0)||(+b.tot||0)-(+a.tot||0));
 return L.map((p,i)=>{const on=rid&&p.r==rid;return`<div class="it"><div class="tm" style="text-align:left;min-width:28px">${i+1}º</div><div class="b"><b>${esc(String(p.n||'?').slice(0,30))}${p.me?' (você)':''}</b><small>${on?(p.d?'Terminou':'Respondendo…'):'Aguardando'} · 🏆 ${+p.w||0} · ${+p.tot||0} pts</small></div><div class="tm">${on?(+p.s||0)+'/'+n:'–'}</div></div>`}).join('')}
function quiz(){if(!QCAP)return'<h2>Quiz</h2><div class="empty">O Quiz só funciona dentro do Claude.</div>';
 if(!QS.net)return`<h2 style="margin-top:8px">Quiz em sala 🎯</h2><p style="color:var(--mu);margin:0">Crie uma sala, passe o código para os amigos e deixe a IA fazer as perguntas. Quem acertar mais ganha!</p><button class="btn" onclick="qjoin(Math.random().toString(36).slice(2,6))">Criar sala</button><label>Entrar com código</label><input id="qc" maxlength="6" placeholder="Código da sala" style="text-transform:uppercase"><button class="btn g" onclick="qjoin($('#qc').value)">Entrar na sala</button>`;

 else if(rd&&!QS.done){const q=rd.qs[QS.i];b=`<h2>Pergunta ${QS.i+1} de ${rd.qs.length}</h2><div class="it"><b style="font-size:17px">${esc(q.q)}</b></div>`+q.o.map((o,k)=>`<button class="it" style="width:100%;text-align:left;cursor:pointer;${QS.sel>=0?(k==q.a?'border-color:var(--gr);background:rgba(2,176,27,.16)':k==QS.sel?'border-color:#E5484D;background:rgba(229,72,77,.16)':''):''}" onclick="qans(${k})">${'ABCD'[k]}) ${esc(o)}</button>`).join('')}

const fired={};
function chk(){if(!S||!S.notif||!('Notification' in window)||Notification.permission!='granted')return;const d=new Date(),hm=d.toTimeString().slice(0,5),k=today(),now=d.getHours()*60+d.getMinutes();
