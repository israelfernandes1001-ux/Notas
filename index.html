<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Minha Aula</title><meta name="theme-color" content="#6C5CE7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F1FF;--cd:#fff;--tx:#1D1A3B;--mu:#7C79A0;--pr:#6C5CE7;--pr2:#8E7DFF;--bd:#E7E4FA;--hl:#E4FF6B;--sh:0 10px 30px rgba(84,66,200,.13);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121020;--cd:#1D1A33;--tx:#F2F0FF;--mu:#9C99C2;--bd:#2C2947;--sh:0 10px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#121020;--cd:#1D1A33;--tx:#F2F0FF;--mu:#9C99C2;--bd:#2C2947;--sh:0 10px 30px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.45 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0;letter-spacing:-.02em}
main{max-width:480px;margin:0 auto;padding:18px 18px 110px}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--bd);background:var(--cd);outline:0;margin-top:6px}
input:focus,select:focus{border-color:var(--pr)}
label{display:block;margin-top:12px;font-weight:700;font-size:13px;color:var(--mu)}
.btn{width:100%;padding:14px;border:0;border-radius:16px;background:var(--pr);color:#fff;font-weight:700;font-size:16px;margin-top:16px;cursor:pointer;box-shadow:0 8px 20px rgba(108,92,231,.35)}
.btn.g{background:transparent;color:var(--pr);box-shadow:none;border:1.5px dashed var(--pr2)}
.btn.r{background:transparent;color:#E5484D;box-shadow:none}
.login{min-height:88vh;display:flex;flex-direction:column;justify-content:center}
.logo{width:72px;height:72px;border-radius:24px;background:var(--pr);display:grid;place-items:center;font-size:36px;transform:rotate(-6deg);box-shadow:var(--sh);margin-bottom:18px}
.login h1{font-size:44px;font-weight:800}.login p{color:var(--mu);margin:6px 0 14px}
.hero{background:linear-gradient(135deg,#5B49E0,#8E7DFF);color:#fff;border-radius:28px;padding:22px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero h1{font-size:28px;font-weight:800}.hero p{margin:4px 0 0;opacity:.85}
.pills{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.pill{background:rgba(255,255,255,.2);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:700}
h2{font-size:20px;margin:26px 0 10px;font-weight:800}
.it{display:flex;gap:12px;align-items:center;background:var(--cd);border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:var(--sh);border:1px solid var(--bd)}
.bar{width:6px;align-self:stretch;border-radius:9px;flex:none}
.it .b{flex:1;min-width:0}.it b{display:block;font-size:16px}.it small{color:var(--mu)}
.now{background:var(--hl);color:#1D1A3B;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;margin-left:6px}
.tm{font-family:'Bricolage Grotesque';font-weight:800;text-align:right;font-size:15px;line-height:1.2}.tm small{display:block;font-family:'DM Sans';font-weight:500}
.ck{width:26px;height:26px;border-radius:9px;border:2px solid var(--pr2);background:none;flex:none;cursor:pointer;color:#fff;font-weight:800}
.ck.on{background:var(--pr);border-color:var(--pr)}.done b{text-decoration:line-through;opacity:.5}
.x{border:0;background:none;color:var(--mu);font-size:18px;cursor:pointer;padding:6px}
.empty{text-align:center;color:var(--mu);padding:26px 10px;border:1.5px dashed var(--bd);border-radius:20px}
.days,.sw{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.dc{flex:none;min-width:52px;padding:10px 0;text-align:center;border-radius:16px;background:var(--cd);border:1.5px solid var(--bd);font-weight:700;cursor:pointer}
.dc.on{background:var(--pr);color:#fff;border-color:var(--pr)}.dc.hj{box-shadow:0 0 0 3px var(--hl)}
.sw span{width:34px;height:34px;border-radius:12px;flex:none;cursor:pointer;border:3px solid transparent}.sw span.on{border-color:var(--tx)}
.tab{position:fixed;left:0;right:0;bottom:0;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));background:var(--cd);border-top:1px solid var(--bd);display:flex;justify-content:center;gap:4px}
.tab button{flex:1;max-width:110px;border:0;background:none;color:var(--mu);font-size:11px;font-weight:700;display:grid;justify-items:center;gap:3px;padding:6px;border-radius:14px;cursor:pointer}
.tab button.on{color:var(--pr);background:var(--bg)}.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sheet{position:fixed;inset:0;background:rgba(15,12,40,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.o{display:flex}.sheet>div{background:var(--bg);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.seg{display:flex;background:var(--cd);border-radius:14px;padding:4px;margin-top:6px;border:1.5px solid var(--bd)}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:700;color:var(--mu);cursor:pointer}.seg button.on{background:var(--pr);color:#fff}
textarea{width:100%;height:74px;border-radius:14px;border:1.5px solid var(--bd);background:var(--cd);color:var(--mu);padding:10px;font-size:12px;margin-top:6px;resize:none}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:20}#toast.o{opacity:1}
#off{display:none;position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:30;background:var(--tx);color:var(--bg);text-align:center;font-size:12px;font-weight:700;padding:5px}#off.o{display:block}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<main id="app"></main><div class="sheet" id="sh" onclick="if(event.target==this)cl()"><div id="shb"></div></div><div id="off">Sem internet · tudo continua funcionando</div><div id="toast"></div>
<script>
const SRC='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
const $=s=>document.querySelector(s),DN=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'],ORD=[1,2,3,4,5,6,0],COL=['#6C5CE7','#00B894','#FF6B81','#0984E3','#F5A623','#E17055','#D63FA6','#00B8D4'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE'),mins=t=>{const[a,b]=t.split(':');return+a*60+ +b},uid=()=>Math.random().toString(36).slice(2,9);
let S=null;try{S=JSON.parse(localStorage.getItem('aula'))}catch(e){}
const save=()=>{try{localStorage.setItem('aula',JSON.stringify(S))}catch(e){toast('Não consegui salvar neste navegador. Copie um backup!')}};
let tab='hoje',sel=new Date().getDay(),fc=COL[0],ftype='dia',fdays=[];
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('o');setTimeout(()=>t.classList.remove('o'),2200)};
const cl=()=>$('#sh').classList.remove('o');
const op=h=>{$('#shb').innerHTML=h;$('#sh').classList.add('o')};
const IC={hoje:'<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/>',hor:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/>',lem:'<path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 004 0"/>',eu:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'};
function activeRem(){const t=today(),n=Date.now();return S.rem.filter(r=>r.fixed?(!r.exp||r.exp>=n):true).filter(r=>r.fixed||r.d>=t)}
function render(){
 if(!S){$('#app').innerHTML=`<div class="login"><div class="logo">📚</div><h1>Minha Aula</h1><p>Seu horário e seus lembretes, sempre à mão.</p>
 <label>Seu nome</label><input id="nm" placeholder="Ex: Ana"><label>Sua turma</label><input id="tm" placeholder="Ex: 8º A">
 <label>Código de um colega (opcional)</label><input id="cd" placeholder="Cole aqui para copiar o horário dele"><button class="btn" onclick="enter()">Entrar</button></div>`;return}
 const T={hoje:hoje,hor:horario,lem:lembretes,eu:perfil};
 $('#app').innerHTML=T[tab]()+`<nav class="tab">${[['hoje','Hoje'],['hor','Horário'],['lem','Lembretes'],['eu','Perfil']].map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render();scrollTo(0,0)"><svg viewBox="0 0 24 24">${IC[k]}</svg>${l}</button>`).join('')}</nav>`}
function enter(){const n=$('#nm').value.trim();if(!n)return toast('Digite seu nome');S={name:n,turma:$('#tm').value.trim(),sched:{},rem:[],notif:false};const c=$('#cd').value.trim();if(c){const d=dec(c);if(d)S.sched=d.s;else toast('Código inválido — entrei sem ele')}save();render()}
function aulas(d){return(S.sched[d]||[]).slice().sort((a,b)=>mins(a.s)-mins(b.s))}
function rowAula(a,now){const nw=now!=null&&now>=mins(a.s)&&now<mins(a.e);return`<div class="it"><i class="bar" style="background:${a.c}"></i><div class="b"><b>${esc(a.m)}${nw?'<span class="now">AGORA</span>':''}</b><small>${a.r?esc(a.r):'Sem sala'}</small></div><div class="tm">${a.s}<small>até ${a.e}</small></div>${now==null?`<button class="x" onclick="fAula('${a.id}')">✎</button>`:''}</div>`}
function rowRem(r,ed){const dn=r.done;return`<div class="it ${dn?'done':''}"><button class="ck ${dn?'on':''}" onclick="tg('${r.id}')">${dn?'✓':''}</button><div class="b" onclick="${ed?`fRem('${r.id}')`:''}"><b>${esc(r.t)}</b><small>${r.fixed?'Fixo · '+(r.exp?'até '+new Date(r.exp).toLocaleDateString('pt-BR'):'para sempre'):new Date(r.d+'T12:00').toLocaleDateString('pt-BR',{day:'numeric',month:'short'})}${r.time?' · '+r.time:''}</small></div>${ed?`<button class="x" onclick="rm('${r.id}')">✕</button>`:''}</div>`}
function hoje(){const d=new Date(),a=aulas(d.getDay()),now=d.getHours()*60+d.getMinutes(),t=today(),rs=activeRem().filter(r=>r.fixed||r.d==t),h=d.getHours();
 return`<div class="hero"><h1>${h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}, ${esc(S.name)}!</h1><p>${DN[d.getDay()]}, ${d.toLocaleDateString('pt-BR',{day:'numeric',month:'long'})}</p><div class="pills"><span class="pill">${a.length} aula${a.length==1?'':'s'}</span><span class="pill">${rs.filter(r=>!r.done).length} lembrete${rs.filter(r=>!r.done).length==1?'':'s'}</span>${S.turma?`<span class="pill">Turma ${esc(S.turma)}</span>`:''}</div></div>
 <h2>Aulas de hoje</h2>${a.length?a.map(x=>rowAula(x,now)).join(''):'<div class="empty">Nenhuma aula hoje 🎉<br>Cadastre suas matérias na aba Horário.</div>'}
 <h2>Lembretes de hoje</h2>${rs.length?rs.map(r=>rowRem(r,false)).join(''):'<div class="empty">Nada para lembrar hoje.</div>'}`}
function horario(){const a=aulas(sel);return`<h2 style="margin-top:8px">Meu horário</h2><div class="days">${ORD.map(d=>`<div class="dc ${d==sel?'on':''} ${d==new Date().getDay()?'hj':''}" onclick="sel=${d};render()">${DN[d].slice(0,3)}</div>`).join('')}</div>
 <h2 style="font-size:17px">${DN[sel]}</h2>${a.length?a.map(x=>rowAula(x)).join(''):'<div class="empty">Sem matérias neste dia.</div>'}<button class="btn g" onclick="fAula()">+ Adicionar matéria</button>`}
function lembretes(){const f=S.rem.filter(r=>r.fixed&&(!r.exp||r.exp>=Date.now())),d=S.rem.filter(r=>!r.fixed&&r.d>=today()).sort((a,b)=>a.d.localeCompare(b.d));
 return`<h2 style="margin-top:8px">Lembretes</h2><h3 style="margin:14px 0 8px;color:var(--mu)">Fixos</h3>${f.length?f.map(r=>rowRem(r,true)).join(''):'<div class="empty">Nenhum lembrete fixo.</div>'}<h3 style="margin:18px 0 8px;color:var(--mu)">Com data</h3>${d.length?d.map(r=>rowRem(r,true)).join(''):'<div class="empty">Nenhum lembrete com data.</div>'}<button class="btn g" onclick="fRem()">+ Novo lembrete</button>`}
function perfil(){return`<h2 style="margin-top:8px">Perfil</h2><label>Nome</label><input value="${esc(S.name)}" onchange="S.name=this.value;save();toast('Salvo')"><label>Turma</label><input value="${esc(S.turma)}" onchange="S.turma=this.value;save();toast('Salvo')">
 <h2>Notificações</h2><div class="it"><div class="b"><b>Avisos no celular</b><small>${S.notif?'Ativadas: aula em 10 min e lembretes com hora':'Receba aviso das aulas e lembretes'}</small></div></div>${S.notif?'':'<button class="btn" style="margin-top:0" onclick="askN()">Ativar notificações</button>'}
 <h2>Uso offline</h2><div class="it"><div class="b"><b>${navigator.onLine?'Você está online':'Você está offline'}</b><small>Tudo fica salvo neste aparelho e funciona sem internet.</small></div></div>${DL?'<button class="btn g" style="margin-top:0" onclick="saveApp()">Baixar o app para usar offline</button>':''}<button class="btn g" style="margin-top:8px" onclick="bk()">Copiar backup completo</button>
 <h2>Compartilhar horário</h2><label>Seu código</label><textarea readonly onclick="this.select()">${enc()}</textarea><button class="btn g" style="margin-top:8px" onclick="navigator.clipboard.writeText(enc()).then(()=>toast('Código copiado!'),()=>toast('Selecione e copie o código'))">Copiar meu código</button>
 <label>Importar código de colega ou backup</label><input id="imp" placeholder="Cole o código aqui"><button class="btn" onclick="imp()">Importar horário</button><button class="btn r" onclick="if(confirm('Sair e apagar tudo deste aparelho?')){S=null;localStorage.removeItem('aula');render()}">Sair</button>`}
function enc(){try{return'AULA-'+btoa(unescape(encodeURIComponent(JSON.stringify({n:S.name,t:S.turma,s:S.sched}))))}catch(e){return''}}
function dec(c){try{return JSON.parse(decodeURIComponent(escape(atob(c.trim().replace(/^(AULA|BKP)-/,'')))))}catch(e){return null}}
function bk(){try{const c='BKP-'+btoa(unescape(encodeURIComponent(JSON.stringify({n:S.name,t:S.turma,s:S.sched,r:S.rem}))));navigator.clipboard.writeText(c).then(()=>toast('Backup copiado! Guarde em lugar seguro'),()=>prompt('Copie seu backup:',c))}catch(e){}}
let DL=null;try{window.claude&&claude.use('downloads').then(d=>{DL=d;if(S&&tab=='eu')render()},()=>{})}catch(e){}
function saveApp(){DL.save({filename:'minha-aula.html',data:SRC}).then(()=>toast('Arquivo salvo! Abra no navegador, mesmo offline'),e=>{if(!e||e.code!='declined')toast('Não foi possível baixar')})}
function imp(){const v=$('#imp').value.trim(),d=dec(v);if(!d||!d.s)return toast('Código inválido');if(/^BKP-/.test(v)){if(!confirm('Restaurar backup? Isso substitui seus dados atuais.'))return;S.name=d.n||S.name;S.turma=d.t||'';S.sched=d.s;S.rem=d.r||[];save();tab='hoje';render();return toast('Backup restaurado!')}if(!confirm(`Trocar seu horário pelo de ${d.n||'colega'}?`))return;S.sched=d.s;if(d.t&&!S.turma)S.turma=d.t;save();tab='hor';render();toast('Horário importado!')}
function tg(id){const r=S.rem.find(x=>x.id==id);r.done=!r.done;save();render()}
function rm(id){if(!confirm('Apagar este lembrete?'))return;S.rem=S.rem.filter(x=>x.id!=id);save();render()}
function sw(){return COL.map(c=>`<span class="${c==fc?'on':''}" style="background:${c}" onclick="fc='${c}';document.querySelectorAll('.sw span').forEach(e=>e.classList.toggle('on',e.style.background&&e.getAttribute('style').includes('${c}')))"></span>`).join('')}
function fAula(id){const a=id?Object.values(S.sched).flat().find(x=>x.id==id):{m:'',s:'08:00',e:'08:50',r:'',c:COL[0]};fc=a.c;fdays=[sel];
 op(`<h2 style="margin-top:0">${id?'Editar':'Nova'} matéria</h2><label>Matéria</label><input id="fm" value="${esc(a.m)}" placeholder="Ex: Matemática"><div style="display:flex;gap:10px"><div style="flex:1"><label>Início</label><input id="fs" type="time" value="${a.s}"></div><div style="flex:1"><label>Fim</label><input id="fe" type="time" value="${a.e}"></div></div><label>Sala (opcional)</label><input id="fr" value="${esc(a.r)}" placeholder="Ex: Sala 12">
 <label>Cor</label><div class="sw">${sw()}</div>${id?'':`<label>Repetir nos dias</label><div class="days">${ORD.map(d=>`<div class="dc ${d==sel?'on':''}" onclick="this.classList.toggle('on');fdays=[...document.querySelectorAll('#shb .dc.on')].map(e=>ORD[[...e.parentNode.children].indexOf(e)])">${DN[d].slice(0,3)}</div>`).join('')}</div>`}
 <button class="btn" onclick="sAula('${id||''}')">Salvar</button>${id?`<button class="btn r" onclick="dAula('${id}')">Apagar matéria</button>`:''}`)}
function sAula(id){const m=$('#fm').value.trim(),s=$('#fs').value,e=$('#fe').value;if(!m||!s||!e)return toast('Preencha matéria e horários');if(mins(e)<=mins(s))return toast('O fim precisa ser depois do início');
 const o={id:id||uid(),m,s,e,r:$('#fr').value.trim(),c:fc};if(id){for(const d in S.sched)S.sched[d]=S.sched[d].map(x=>x.id==id?o:x)}else{if(!fdays.length)return toast('Escolha ao menos um dia');fdays.forEach(d=>{(S.sched[d]=S.sched[d]||[]).push({...o,id:uid()})})}save();cl();render()}
function dAula(id){for(const d in S.sched)S.sched[d]=S.sched[d].filter(x=>x.id!=id);save();cl();render()}
function fRem(id){const r=id?S.rem.find(x=>x.id==id):{t:'',d:today(),fixed:false,time:''};ftype=r.fixed?'fixo':'dia';
 op(`<h2 style="margin-top:0">${id?'Editar':'Novo'} lembrete</h2><label>O que lembrar?</label><input id="lt" value="${esc(r.t)}" placeholder="Ex: Trazer trabalho de ciências"><label>Tipo</label><div class="seg"><button class="${ftype=='dia'?'on':''}" onclick="ty('dia',this)">De um dia</button><button class="${ftype=='fixo'?'on':''}" onclick="ty('fixo',this)">Fixo</button></div>
 <div id="fd"><label>Data</label><input id="ld" type="date" value="${r.d||today()}"></div><div id="ff" style="display:none"><label>Fica salvo por</label><select id="lx"><option value="1">1 dia</option><option value="3">3 dias</option><option value="7">1 semana</option><option value="30">1 mês</option><option value="0" selected>Para sempre</option></select></div>
 <label>Hora do aviso (opcional)</label><input id="lh" type="time" value="${r.time||''}"><button class="btn" onclick="sRem('${id||''}')">Salvar</button>`);ty(ftype)}
function ty(t,b){ftype=t;if(b){b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}$('#fd').style.display=t=='dia'?'block':'none';$('#ff').style.display=t=='fixo'?'block':'none'}
function sRem(id){const t=$('#lt').value.trim();if(!t)return toast('Escreva o lembrete');const fx=ftype=='fixo',n=+$('#lx').value,e=new Date();e.setHours(23,59,59,0);e.setDate(e.getDate()+n);
 const o={id:id||uid(),t,fixed:fx,d:fx?today():($('#ld').value||today()),exp:fx&&n?e.getTime():null,time:$('#lh').value,done:false};if(id)S.rem=S.rem.map(x=>x.id==id?o:x);else S.rem.push(o);save();cl();tab='lem';render()}
async function askN(){if(!('Notification' in window))return toast('Este navegador não suporta notificações');const p=await Notification.requestPermission();S.notif=p=='granted';save();render();if(S.notif)ntf('Notificações ativadas ✅','Você será avisado das aulas e lembretes.');else toast('Permissão negada no navegador')}
function ntf(t,b){try{new Notification(t,{body:b})}catch(e){}}
const fired={};
function chk(){if(!S||!S.notif||!('Notification' in window)||Notification.permission!='granted')return;const d=new Date(),hm=d.toTimeString().slice(0,5),k=today(),now=d.getHours()*60+d.getMinutes();
 if(S.sum!=k){S.sum=k;save();const a=aulas(d.getDay()).length,r=activeRem().filter(x=>(x.fixed||x.d==k)&&!x.done).length;ntf(`Bom dia, ${S.name}!`,`Hoje: ${a} aula(s) e ${r} lembrete(s).`)}
